<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Animated scalable system data flow</title>
  <desc id="desc">Requests travel through an API gateway, event stream, services, AI engine, and database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset=".5" stop-color="#111b35"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="pulse" x1="0" x2="1"><stop stop-color="#70e1c1"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="210" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#263658" stroke-width="3"><path d="M105 105H1095"/><path d="M315 105q40-70 80 0t80 0" opacity=".35"/></g>
  <g font-family="ui-monospace,Consolas,monospace" text-anchor="middle">
    <g transform="translate(105 105)"><circle r="43" fill="#131d35" stroke="#70e1c1" stroke-width="2"/><text y="5" fill="#eef4ff" font-size="15">CLIENT</text><text y="70" fill="#8294b8" font-size="12">request</text></g>
    <g transform="translate(300 105)"><rect x="-57" y="-37" width="114" height="74" rx="13" fill="#131d35" stroke="#7aa2ff" stroke-width="2"/><text y="-2" fill="#eef4ff" font-size="14">API</text><text y="17" fill="#8294b8" font-size="11">GATEWAY</text><text y="70" fill="#8294b8" font-size="12">route</text></g>
    <g transform="translate(500 105)"><rect x="-62" y="-37" width="124" height="74" rx="13" fill="#131d35" stroke="#e9b949" stroke-width="2"/><text y="-2" fill="#eef4ff" font-size="14">EVENT</text><text y="17" fill="#8294b8" font-size="11">STREAM</text><text y="70" fill="#8294b8" font-size="12">decouple</text></g>
    <g transform="translate(700 105)"><rect x="-62" y="-37" width="124" height="74" rx="13" fill="#131d35" stroke="#70e1c1" stroke-width="2"/><text y="-2" fill="#eef4ff" font-size="14">SERVICES</text><text y="17" fill="#8294b8" font-size="11">SCALE × N</text><text y="70" fill="#8294b8" font-size="12">compute</text></g>
    <g transform="translate(900 105)"><rect x="-57" y="-37" width="114" height="74" rx="13" fill="#131d35" stroke="#d478ff" stroke-width="2"/><text y="-2" fill="#eef4ff" font-size="14">AI</text><text y="17" fill="#8294b8" font-size="11">ENGINE</text><text y="70" fill="#8294b8" font-size="12">augment</text></g>
    <g transform="translate(1095 105)"><ellipse cy="-25" rx="48" ry="15" fill="#131d35" stroke="#7aa2ff" stroke-width="2"/><path d="M1047-25v52c0 20 96 20 96 0v-52" fill="#131d35" stroke="#7aa2ff" stroke-width="2"/><ellipse cy="27" rx="48" ry="15" fill="#131d35" stroke="#7aa2ff" stroke-width="2"/><text y="5" fill="#eef4ff" font-size="13">DATA</text><text y="70" fill="#8294b8" font-size="12">persist</text></g>
  </g>
  <g fill="url(#pulse)" filter="url(#glow)">
    <circle r="6"><animateMotion dur="4.8s" repeatCount="indefinite" path="M105 105H1095"/></circle>
    <circle r="4"><animateMotion dur="4.8s" begin="-1.6s" repeatCount="indefinite" path="M105 105H1095"/></circle>
    <circle r="4"><animateMotion dur="4.8s" begin="-3.2s" repeatCount="indefinite" path="M105 105H1095"/></circle>
  </g>
  <text x="24" y="28" fill="#536688" font-family="ui-monospace,Consolas,monospace" font-size="11">SYSTEM_FLOW // HEALTHY</text>
  <circle cx="1170" cy="24" r="5" fill="#70e1c1"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
</svg>
